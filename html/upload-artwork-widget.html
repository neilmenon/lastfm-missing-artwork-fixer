<div class="form-group form-group--lfmmaf js-form-group" id="lfmmaf-widget">
    <label for="lfmmaf-artwork-search" class="control-label lfmmaf-widget-label">
        <img class="lfmmaf-extension-icon">
        <span>Artwork Finder</span>
    </label>
    <div class="js-form-group-controls form-group-controls">
        <div id="lfmmaf-artwork-search-filter-container">
            <div>
                <input type="text" id="lfmmaf-artwork-search" placeholder="Start typing to search or enter direct image link...">
                <div class="dot-pulse" id="lffmaf-input-loading"></div>
                <a href="" id="lfmmaf-google-images-search-link" target="_blank" title="Search on Google Images">
                    <img src="https://google.com/favicon.ico" alt="Google icon">
                </a>
            </div>
            <select id="lfmmaf-artwork-source"></select>
        </div>
        <div id="lfmmaf-messages-container"></div>
        <div id="lfmmaf-results-container"></div>
    </div>
</div>
